[project]
name = "portfolio-data-cleaner"
version = "0.1.0"
description = "A lightweight CSV and Excel cleaning demo."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
